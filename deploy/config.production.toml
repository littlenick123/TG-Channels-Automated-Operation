[content]
keep_tags = ["#正式启动前填写"]
drop_tags = []
caption_limit = 1024

[schedule]
timezone = "Asia/Shanghai"
daily_time = "00:01"

[reporting]
chat_id = 123456789

[processing]
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
ffmpeg_threads = 4
crf = 24
preset = "medium"
audio_bitrate = "128k"
minimum_source_short_edge = 1080
album_settle_seconds = 300
disk_reserve_bytes = 1073741824

[runtime]
work_dir = "/var/cache/channel-operator/work"
max_candidates_per_run = 12
max_runtime_hours = 6
download_concurrency = 4
flood_sleep_threshold_seconds = 60
retry_delays_seconds = [30, 120, 600]

[[channel_groups]]
name = "channel_b"
source_channel = -1001234567890
target_channel = -1009876543210
database_path = "/var/lib/channel-operator/channel_b.db"
daily_success_count = 4

[[channel_groups]]
name = "channel_c"
source_channel = -1001234567890
target_channel = -1009876543211
database_path = "/var/lib/channel-operator/channel_c.db"
daily_success_count = 2
