[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-channel-operator"
version = "0.1.0"
description = "Automate Telegram channel video transcoding and album publishing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hachoir>=3.3,<4",
    "Telethon==1.44.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
speed = ["cryptg>=0.5,<1"]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
channel-operator = "channel_operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
