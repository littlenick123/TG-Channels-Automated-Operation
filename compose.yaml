name: telegram-channel-operator

services:
  channel-operator:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-channel-operator:local
    container_name: channel-operator
    user: "0:0"
    restart: unless-stopped
    init: true
    stop_grace_period: 10m
    cpus: 4.0
    mem_limit: 5g
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./work
        target: /app/work
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
